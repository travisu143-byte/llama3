<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadRover Travel App & Route Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            },
            scenic: {
              500: '#10b981',
              600: '#059669',
            },
            fastest: {
              500: '#3b82f6',
              600: '#2563eb',
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 3px;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-effect {
      animation: pulse-ring 2s infinite ease-in-out;
    }
    .selected-mode {
      border-color: rgba(249, 115, 22, 0.7) !important;
      background: rgba(249, 115, 22, 0.12) !important;
      color: #fff !important;
      box-shadow: 0 0 0 1px rgba(249, 115, 22, 0.25);
    }
    .selected-mode.scenic {
      border-color: rgba(16, 185, 129, 0.7) !important;
      background: rgba(16, 185, 129, 0.12) !important;
      color: #fff !important;
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.25);
    }
    .selected-mode.fastest {
      border-color: rgba(59, 130, 246, 0.7) !important;
      background: rgba(59, 130, 246, 0.12) !important;
      color: #fff !important;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.25);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white custom-scrollbar">
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800/80 px-4 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i class="fa-solid fa-route text-white text-xl"></i>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">RoadRover</span>
          <span class="text-xs ml-2 px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-500 border border-brand-500/20 font-mono font-semibold">v2.4 PRO</span>
        </div>
      </div>

      <div class="flex items-center space-x-2 md:space-x-4">
        <button id="runDiagnosticsBtn" onclick="openDiagnosticsModal()" class="flex items-center space-x-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3.5 py-1.5 rounded-lg transition-all text-xs md:text-sm font-medium shadow-sm active:scale-95">
          <i class="fa-solid fa-stethoscope text-emerald-400"></i>
          <span class="hidden sm:inline">Run System Diagnostics</span>
          <span class="sm:hidden">Diagnostics</span>
        </button>

        <div class="h-6 w-[1px] bg-slate-800"></div>

        <a id="extMapNavBtn" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-2 bg-brand-500 hover:bg-brand-600 text-white px-3.5 py-1.5 rounded-lg transition-all text-xs md:text-sm font-semibold shadow-md shadow-brand-500/20 active:scale-95">
          <i class="fa-solid fa-location-arrow"></i>
          <span class="hidden md:inline">Open in Google Maps</span>
          <span class="md:hidden">Navigate</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <section class="lg:col-span-5 flex flex-col space-y-6">
      <div class="glass-panel rounded-2xl p-5 shadow-xl relative overflow-hidden">
        <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
          <h2 class="text-base font-bold text-white flex items-center">
            <i class="fa-solid fa-compass text-brand-500 mr-2"></i> Route Planner Engine
          </h2>
          <span id="routeStatusBadge" class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 font-mono border border-slate-700">
            Status: Active
          </span>
        </div>

        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Scenic Presets</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="loadPresetRoute('Pacific Coast Highway')" class="preset-btn text-left p-2 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-brand-500/40 transition-all group">
              <div class="text-xs font-bold text-slate-200 group-hover:text-brand-400">Pacific Coast Hwy</div>
              <div class="text-[10px] text-slate-400">SF to LA</div>
            </button>
            <button onclick="loadPresetRoute('Route 66 Classic')" class="preset-btn text-left p-2 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-brand-500/40 transition-all group">
              <div class="text-xs font-bold text-slate-200 group-hover:text-brand-400">Route 66 Classic</div>
              <div class="text-[10px] text-slate-400">Chicago to LA</div>
            </button>
            <button onclick="loadPresetRoute('Blue Ridge Parkway')" class="preset-btn text-left p-2 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-brand-500/40 transition-all group">
              <div class="text-xs font-bold text-slate-200 group-hover:text-brand-400">Blue Ridge Pkwy</div>
              <div class="text-[10px] text-slate-400">Shenandoah to Smokies</div>
            </button>
            <button onclick="loadPresetRoute('Red Rock Scenic Byway')" class="preset-btn text-left p-2 rounded-xl bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-brand-500/40 transition-all group">
              <div class="text-xs font-bold text-slate-200 group-hover:text-brand-400">Red Rock Byway</div>
              <div class="text-[10px] text-slate-400">Sedona Loop</div>
            </button>
          </div>
        </div>

        <div class="space-y-3 relative mb-5">
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-emerald-400">
              <i class="fa-solid fa-circle-dot text-xs"></i>
            </div>
            <input type="text" id="originInput" placeholder="Starting Location..." value="San Francisco, CA" class="w-full pl-9 pr-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-slate-500 transition-all">
          </div>

          <div class="flex justify-center -my-2 relative z-10">
            <button id="swapBtn" onclick="swapLocations()" title="Swap Origin and Destination" class="bg-slate-800 hover:bg-brand-500 border border-slate-700 text-slate-300 hover:text-white p-2 rounded-full transition-all shadow-md active:scale-90">
              <i class="fa-solid fa-arrows-up-down text-xs"></i>
            </button>
          </div>

          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-brand-500">
              <i class="fa-solid fa-location-dot text-xs"></i>
            </div>
            <input type="text" id="destinationInput" placeholder="Destination..." value="Los Angeles, CA" class="w-full pl-9 pr-4 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-slate-500 transition-all">
          </div>

          <button id="recalculateBtn" onclick="handleRouteRecalculation()" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-2.5 rounded-xl transition-all shadow-lg shadow-brand-500/20 flex items-center justify-center space-x-2 active:scale-98">
            <i class="fa-solid fa-arrows-rotate"></i>
            <span>Update & Recalculate Route</span>
          </button>
        </div>

        <div class="pt-4 border-t border-slate-800">
          <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Driving Experience Mode</label>
          <div class="grid grid-cols-2 gap-3 p-1 bg-slate-900/80 rounded-xl border border-slate-800">
            <button id="modeScenicBtn" onclick="setDrivingMode('scenic')" class="mode-btn scenic flex flex-col items-center justify-center p-3 rounded-lg border transition-all text-center">
              <i class="fa-solid fa-mountain-sun text-lg mb-1"></i>
              <span class="text-xs font-bold">Scenic Passion</span>
              <span class="text-[10px] opacity-75">Vistas & Twisty Roads</span>
            </button>

            <button id="modeFastestBtn" onclick="setDrivingMode('fastest')" class="mode-btn fastest flex flex-col items-center justify-center p-3 rounded-lg border transition-all text-center">
              <i class="fa-solid fa-bolt text-lg mb-1"></i>
              <span class="text-xs font-bold">Fastest Highway</span>
              <span class="text-[10px] opacity-75">Direct Transit & Speed</span>
            </button>
          </div>
        </div>
      </div>

      <div class="glass-panel rounded-2xl p-5 shadow-xl flex-1 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
            <div class="flex items-center space-x-2">
              <div class="w-7 h-7 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center">
                <i class="fa-solid fa-tags text-sm"></i>
              </div>
              <h3 class="text-base font-bold text-white">Smart Coupon Stacker</h3>
            </div>
            <span id="appliedCouponBadge" class="text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-0.5 rounded-full">
              0 Coupons Applied
            </span>
          </div>

          <button id="scanCouponsBtn" onclick="runHoneyCouponScan()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-bold py-2.5 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2 mb-4 active:scale-98">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span id="scanBtnText">Auto-Find Highway Coupons</span>
          </button>

          <div id="scanProgressBarContainer" class="hidden mb-4">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
              <span id="scanProgressLabel">Testing discount codes...</span>
              <span id="scanProgressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
              <div id="scanProgressBar" class="bg-amber-400 h-full w-0 transition-all duration-300"></div>
            </div>
          </div>

          <div id="couponsList" class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-1">
            <div class="text-center py-6 text-slate-500 text-xs italic">
              Click "Auto-Find Highway Coupons" to test verified deals for gas stations & hotels along this route.
            </div>
          </div>
        </div>

        <div class="mt-4 pt-4 border-t border-slate-800 bg-slate-900/40 p-3 rounded-xl border border-slate-800/80">
          <div class="grid grid-cols-2 gap-3 text-center">
            <div class="p-2 rounded-lg bg-slate-900/80 border border-slate-800">
              <div class="text-[10px] uppercase font-semibold text-slate-400">Estimated Gas Savings</div>
              <div id="gasSavingsVal" class="text-lg font-black text-emerald-400">$0.00</div>
            </div>
            <div class="p-2 rounded-lg bg-slate-900/80 border border-slate-800">
              <div class="text-[10px] uppercase font-semibold text-slate-400">Rewards Points</div>
              <div id="rewardsPointsVal" class="text-lg font-black text-brand-400">+0 pts</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="lg:col-span-7 flex flex-col space-y-6">
      <div class="glass-panel rounded-2xl p-4 shadow-xl">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
            <div class="text-[11px] font-semibold text-slate-400 uppercase">Total Distance</div>
            <div id="metricDistance" class="text-xl font-black text-white mt-0.5">468 mi</div>
            <div id="metricDistanceSub" class="text-[10px] text-slate-500">Estimated transit</div>
          </div>
          <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
            <div class="text-[11px] font-semibold text-slate-400 uppercase">Estimated Time</div>
            <div id="metricDuration" class="text-xl font-black text-white mt-0.5">9h 15m</div>
            <div id="metricDurationSub" class="text-[10px] text-emerald-400">Scenic Coastal Pace</div>
          </div>
          <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
            <div class="text-[11px] font-semibold text-slate-400 uppercase">Gas Stops</div>
            <div id="metricStops" class="text-xl font-black text-white mt-0.5">3 Recommended</div>
            <div id="metricStopsSub" class="text-[10px] text-amber-400">Top Rated Fuel</div>
          </div>
          <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl">
            <div class="text-[11px] font-semibold text-slate-400 uppercase">Mode Selected</div>
            <div id="metricMode" class="text-sm font-bold text-emerald-400 mt-1 flex items-center truncate">
              <i class="fa-solid fa-mountain-sun mr-1.5"></i>
              <span>Scenic</span>
            </div>
            <div id="metricModeSub" class="text-[10px] text-slate-500">Twisty Roads</div>
          </div>
        </div>
      </div>

      <div class="glass-panel rounded-2xl p-2 shadow-xl flex-1 flex flex-col min-h-[420px] relative overflow-hidden">
        <div class="flex items-center justify-between px-3 py-2 border-b border-slate-800 text-xs text-slate-400">
          <div class="flex items-center space-x-2">
            <i class="fa-solid fa-map-location-dot text-brand-500"></i>
            <span id="currentRouteDisplayTitle" class="font-semibold text-slate-200">San Francisco, CA ➔ Los Angeles, CA</span>
          </div>
          <div class="flex items-center space-x-2">
            <span id="modeBadgeTag" class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
              Scenic Mode Active
            </span>
          </div>
        </div>

        <div class="relative flex-1 w-full h-full min-h-[360px] rounded-xl overflow-hidden bg-slate-950">
          <iframe id="googleMapIframe" title="Route Map View"
            class="w-full h-full border-0 rounded-xl"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
            src="https://maps.google.com/maps?q=San%20Francisco,%20CA%20to%20Los%20Angeles,%20CA&t=&z=7&ie=UTF8&iwloc=&output=embed">
          </iframe>
        </div>
      </div>

      <div class="glass-panel rounded-2xl p-4 shadow-xl">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Key Highlights Along Selected Route</h4>
        <div id="waypointsContainer" class="grid grid-cols-1 sm:grid-cols-3 gap-3"></div>
      </div>
    </section>
  </main>

  <div id="diagnosticsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
    <div class="glass-panel border border-slate-700 w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/90">
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 flex items-center justify-center">
            <i class="fa-solid fa-terminal text-base"></i>
          </div>
          <div>
            <h3 class="text-base font-bold text-white">System Diagnostics & Unit Testing Suite</h3>
            <p class="text-xs text-slate-400">Automated verification of state, route calculation, mode switching & rewards</p>
          </div>
        </div>
        <button onclick="closeDiagnosticsModal()" class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-slate-800">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-6 flex-1 overflow-y-auto custom-scrollbar space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-slate-400 uppercase">Test Suite Results</span>
          <span id="diagnosticOverallStatus" class="text-xs px-2.5 py-1 rounded-full font-mono bg-slate-800 text-slate-300">
            Ready to Execute
          </span>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
            <div class="text-[10px] text-slate-400 font-semibold uppercase">Total Tests</div>
            <div id="diagTotalCount" class="text-lg font-bold text-white">5</div>
          </div>
          <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
            <div class="text-[10px] text-slate-400 font-semibold uppercase">Passed</div>
            <div id="diagPassedCount" class="text-lg font-bold text-emerald-400">0</div>
          </div>
          <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
            <div class="text-[10px] text-slate-400 font-semibold uppercase">Failed</div>
            <div id="diagFailedCount" class="text-lg font-bold text-rose-400">0</div>
          </div>
          <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
            <div class="text-[10px] text-slate-400 font-semibold uppercase">Last Run</div>
            <div id="diagLastRun" class="text-lg font-bold text-white">--</div>
          </div>
        </div>

        <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-slate-400 uppercase">Execution L# This workflow
 will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest


